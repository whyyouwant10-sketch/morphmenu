[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "morphmenu"
version = "0.1.0"
description = "A safe, local, dry-run-first file conversion planner"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "cricm", email = "233500106+whyyouwant10-sketch@users.noreply.github.com"}]
dependencies = []

[project.scripts]
morphmenu = "morphmenu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
